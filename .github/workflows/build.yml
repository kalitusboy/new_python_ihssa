name: Build Windows EXE — إحصاء السكن الريفي (Python)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release (PyInstaller)
    runs-on: windows-2022

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python 3.11 (آخر نسخة مستقرة متوافقة مع Windows 7+) ──
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. تثبيت المكتبات ─────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. التحقق من الاستيراد ────────────────────────────────────
      - name: Verify imports
        run: |
          python -c "import PyQt6; print('PyQt6 OK')"
          python -c "import docx; print('python-docx OK')"
          python -c "import reportlab; print('reportlab OK')"
          python -c "import openpyxl; print('openpyxl OK')"

      # ── 5. بناء EXE بـ PyInstaller ────────────────────────────────
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "ihsaa2026" `
            --icon "assets/fonts/icon.ico" `
            --add-data "assets;assets" `
            --hidden-import "PyQt6.sip" `
            --hidden-import "arabic_reshaper" `
            --hidden-import "bidi.algorithm" `
            --hidden-import "reportlab.graphics" `
            --hidden-import "docx" `
            --hidden-import "openpyxl" `
            --collect-all "PyQt6" `
            --collect-all "arabic_reshaper" `
            main.py

      # ── 6. معلومات البناء ─────────────────────────────────────────
      - name: Build info
        shell: pwsh
        run: |
          Write-Host "══════════════════════════════════════"
          Write-Host "✅ Windows EXE built successfully"
          if (Test-Path "dist\ihsaa2026.exe") {
            $size = [math]::Round((Get-Item "dist\ihsaa2026.exe").Length / 1MB, 1)
            Write-Host "EXE size: $size MB"
          }
          Write-Host "══════════════════════════════════════"

      # ── 7. ضغط الناتج ─────────────────────────────────────────────
      - name: Compress Release
        shell: pwsh
        run: |
          $ts = Get-Date -Format "yyyyMMdd_HHmm"
          $zipName = "ihsaa2026_windows_${ts}.zip"
          Compress-Archive -Path "dist\ihsaa2026.exe" -DestinationPath $zipName
          $size = [math]::Round((Get-Item $zipName).Length / 1MB, 1)
          Write-Host "ZIP: $zipName  ($size MB)"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ── 8. رفع الأرتيفاكت ─────────────────────────────────────────
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ihsaa2026-windows-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error
