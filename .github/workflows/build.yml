name: Build Windows EXE — إحصاء السكن الريفي (Python)

on:
  push:
    branches:
      - 13-05-2026
  pull_request:
    branches:
      - 13-05-2026
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release (PyInstaller)
    runs-on: windows-2022

    steps:

      # ─────────────────────────────────────────────
      # 1) تحميل المشروع
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2) تثبيت Python
      # ─────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ─────────────────────────────────────────────
      # 3) تثبيت المكتبات
      # ─────────────────────────────────────────────
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y docx python-docx
          pip install python-docx==1.1.2
          pip install -r requirements.txt
          pip install pyinstaller

      # ─────────────────────────────────────────────
      # 4) التحقق من المكتبات
      # ─────────────────────────────────────────────
      - name: Verify imports
        shell: pwsh
        run: |
          python -c "import PyQt6; print('PyQt6 OK')"
          python -c "from docx import Document; print('python-docx OK')"
          python -c "from docx.shared import Pt, Cm, Inches; print('docx.shared OK')"
          python -c "import reportlab; print('reportlab OK')"
          python -c "import openpyxl; print('openpyxl OK')"

      # ─────────────────────────────────────────────
      # 5) تنظيف قديم
      # ─────────────────────────────────────────────
      - name: Clean old builds
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path "*.spec") { Remove-Item *.spec -Force }

      # ─────────────────────────────────────────────
      # 6) بناء التطبيق (مجموعة مجلد)
      # ─────────────────────────────────────────────
      - name: Build EXE (onedir)
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onedir `
            --windowed `
            --name "ihsaa2026" `
            --icon "assets/fonts/icon.ico" `
            --add-data "assets;assets" `
            --collect-all PyQt6 `
            --collect-all reportlab `
            --collect-all python-docx `
            --collect-all arabic_reshaper `
            --collect-all bidi `
            --hidden-import PyQt6.sip `
            --hidden-import arabic_reshaper `
            --hidden-import bidi.algorithm `
            --hidden-import reportlab.graphics `
            --hidden-import reportlab.platypus `
            --hidden-import reportlab.lib `
            --hidden-import docx `
            --hidden-import docx.api `
            --hidden-import docx.shared `
            --hidden-import docx.enum.text `
            --hidden-import docx.enum.table `
            --hidden-import docx.oxml `
            --hidden-import openpyxl `
            main.py

      # ─────────────────────────────────────────────
      # 7) التحقق من نجاح البناء
      # ─────────────────────────────────────────────
      - name: Build info
        shell: pwsh
        run: |
          Write-Host "══════════════════════════════════════"
          $exePath = "dist\ihsaa2026\ihsaa2026.exe"
          if (Test-Path $exePath) {
            $folderSize = [math]::Round(
              (Get-ChildItem -Path "dist\ihsaa2026" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB,
              2
            )
            Write-Host "✅ Build folder created successfully"
            Write-Host "📁 Folder size: $folderSize MB"
          } else {
            Write-Error "❌ ihsaa2026.exe not found in dist\ihsaa2026\"
            exit 1
          }
          Write-Host "══════════════════════════════════════"

      # ─────────────────────────────────────────────
      # 8) ضغط المجلد للتوزيع
      # ─────────────────────────────────────────────
      - name: Compress Release
        shell: pwsh
        run: |
          $ts = Get-Date -Format "yyyyMMdd_HHmm"
          $zipName = "ihsaa2026_windows_${ts}.zip"
          Compress-Archive -Path "dist\ihsaa2026" -DestinationPath $zipName
          $zipSize = [math]::Round((Get-Item $zipName).Length / 1MB, 2)
          Write-Host "✅ ZIP created: $zipName"
          Write-Host "📦 ZIP size: $zipSize MB"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ─────────────────────────────────────────────
      # 9) رفع الملف النهائي
      # ─────────────────────────────────────────────
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ihsaa2026-windows-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error
